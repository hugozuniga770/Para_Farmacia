services:
  - type: web
    name: proyecto-farmacia
    env: docker
    plan: free
    branch: maestro
    # Nota: Ya no necesitamos buildCommand ni dockerCommand aquí
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: farmacia-db
          property: connectionString

databases:
  - name: farmacia-db
    plan: free