services:
  - type: web
    name: proyecto-farmacia
    env: docker
    plan: free
    branch: maestro
    buildCommand: "mvn clean install"
    dockerCommand: "java -jar target/dependency/webapp-runner.jar --port $PORT target/*.war"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: farmacia-db
          property: connectionString

databases:
  - name: farmacia-db
    plan: free