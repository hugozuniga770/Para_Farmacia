services:
  - type: web
    name: proyecto-farmacia
    env: shell
    plan: free
    branch: master # OJO: Si tu rama principal se llama 'main', cambia 'master' por 'main'
    buildCommand: "mvn clean install"
    startCommand: "java -jar target/dependency/webapp-runner.jar --port $PORT target/*.war"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: farmacia-db
          property: connectionString

databases:
  - name: farmacia-db
    plan: free