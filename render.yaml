services:
  - type: web
    name: proyecto-farmacia
    plan: free
    branch: main
    buildCommand: "mvn clean install"
    startCommand: "java -jar target/dependency/webapp-runner.jar --port $PORT target/*.war"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: farmacia-db
          property: connectionString

databases:
  - name: farmacia-db
    plan: free