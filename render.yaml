services:
  - type: web
    name: proyecto-farmacia
    env: docker
    plan: free
    branch: maestro
    buildCommand: "mvn clean package" # Usamos 'package' en lugar de 'install'
    dockerCommand: "java -jar target/ProyectoFarmacia1-1.0-SNAPSHOT.jar"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: farmacia-db
          property: connectionString

databases:
  - name: farmacia-db
    plan: free