<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Proveedores - MOTOLAND</title>
  <link rel="stylesheet" href="../style.css">

  <style>
    .form-section {
      background-color: #f9f9f9;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    #catalogo-table {
      width: 100%;
      margin-top: 15px;
      border-collapse: collapse;
    }
    #catalogo-table th, #catalogo-table td {
      padding: 8px;
      border: 1px solid #ddd;
    }
    #catalogo-table input {
      width: 100%;
      padding: 5px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .status-message {
      text-align: center;
      padding: 10px;
      margin-top: 15px;
      border-radius: 5px;
      display: none;
    }
    .status-message.success { background-color: #d4edda; color: #155724; }
    .status-message.error { background-color: #f8d7da; color: #721c24; }
  </style>
</head>
<body>
<div class="container">
  <header class="menu-header">
    <h1>Gestión de Proveedores</h1>
    <button onclick="window.location.href='../menu.html'">Volver al Menú</button>
  </header>

  <form id="proveedor-form">
    <div class="form-section">
      <h2>1. Datos del Proveedor</h2>
      <div class="form-group">
        <label for="nombre">Nombre del Proveedor:</label>
        <input type="text" id="nombre" name="nombre" required>
      </div>
      <div class="form-group">
        <label for="contacto">Contacto:</label>
        <input type="text" id="contacto" name="contacto">
      </div>
    </div>

    <div class="form-section">
      <h2>2. Catálogo de Productos</h2>
      <div class="form-group">
        <label for="cantidad-productos">¿Cuántos productos deseas registrar para este proveedor?</label>
        <input type="number" id="cantidad-productos" min="1" value="1">
        <button type="button" id="generar-btn">Generar Campos</button>
      </div>
      <table id="catalogo-table" style="display:none;">
        <thead>
        <tr>
          <th>Nombre del Producto</th>
          <th>Descripción</th>
          <th>Costo (Bs.)</th>
        </tr>
        </thead>
        <tbody id="catalogo-tbody">
        </tbody>
      </table>
    </div>

    <div class="form-section">
      <button type="submit">Registrar Proveedor y su Catálogo</button>
      <div id="status-message" class="status-message"></div>
    </div>
  </form>
</div>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const generarBtn = document.getElementById('generar-btn');
    const cantidadInput = document.getElementById('cantidad-productos');
    const catalogoTable = document.getElementById('catalogo-table');
    const catalogoTbody = document.getElementById('catalogo-tbody');
    const form = document.getElementById('proveedor-form');
    const statusMessage = document.getElementById('status-message');

    // --- 1. LÓGICA PARA GENERAR LA TABLA DINÁMICA ---
    generarBtn.addEventListener('click', () => {
      const cantidad = parseInt(cantidadInput.value);
      if (isNaN(cantidad) || cantidad < 1) {
        alert('Por favor, ingresa un número válido de productos.');
        return;
      }

      // Limpiamos la tabla anterior
      catalogoTbody.innerHTML = '';

      // Creamos una fila por cada producto indicado
      for (let i = 0; i < cantidad; i++) {
        const row = document.createElement('tr');
        row.innerHTML = `
                        <td><input type="text" name="nombreProducto" placeholder="Ej: Casco AGV" required></td>
                        <td><input type="text" name="descripcion" placeholder="Ej: Talle M, color negro"></td>
                        <td><input type="number" name="costo" min="0" step="0.01" placeholder="Ej: 1500.00" required></td>
                    `;
        catalogoTbody.appendChild(row);
      }

      // Mostramos la tabla
      catalogoTable.style.display = 'table';
    });

    // --- 2. LÓGICA PARA ENVIAR EL FORMULARIO COMPLETO ---
    form.addEventListener('submit', (event) => {
      event.preventDefault(); // Evitamos que la página se recargue

      const nombreProveedor = document.getElementById('nombre').value;
      const contactoProveedor = document.getElementById('contacto').value;

      // Verificamos que se haya generado el catálogo
      const filasCatalogo = catalogoTbody.querySelectorAll('tr');
      if (filasCatalogo.length === 0) {
        alert('Debes generar y rellenar los campos del catálogo antes de registrar.');
        return;
      }

      // Creamos un array para guardar los productos del catálogo
      const catalogo = [];
      filasCatalogo.forEach(row => {
        const item = {
          nombreProducto: row.querySelector('input[name="nombreProducto"]').value,
          descripcion: row.querySelector('input[name="descripcion"]').value,
          costo: parseFloat(row.querySelector('input[name="costo"]').value)
        };
        catalogo.push(item);
      });

      // Creamos el objeto final que enviaremos al servlet
      const datosAEnviar = {
        nombre: nombreProveedor,
        contacto: contactoProveedor,
        catalogo: catalogo
      };

      // Enviamos todo al servlet
      fetch('../proveedores', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(datosAEnviar)
      })
              .then(response => response.json())
              .then(data => {
                statusMessage.textContent = data.message;
                if (data.status === 'success') {
                  statusMessage.className = 'status-message success';
                  form.reset(); // Limpiamos todo el formulario
                  catalogoTable.style.display = 'none'; // Ocultamos la tabla
                  catalogoTbody.innerHTML = '';
                } else {
                  statusMessage.className = 'status-message error';
                }
                statusMessage.style.display = 'block';
                setTimeout(() => statusMessage.style.display = 'none', 5000);
              })
              .catch(error => {
                console.error('Error:', error);
                statusMessage.textContent = 'Error de conexión. Inténtalo de nuevo.';
                statusMessage.className = 'status-message error';
                statusMessage.style.display = 'block';
              });
    });
  });
</script>
</body>
</html>
